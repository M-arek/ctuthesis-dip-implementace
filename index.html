<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couplii AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex overflow-hidden">

    <div id="onboarding-screen" class="flex-1 flex flex-col items-center justify-center p-4 w-full h-full bg-white z-50">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
            <h1 class="text-3xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-blue-600 text-center">Vítej v Couplii</h1>
            <p class="text-gray-500 mb-8 text-center text-sm">Abychom ti mohli co nejlépe pomoci, prozraď nám o sobě pár detailů.</p>
            
            <form id="onboarding-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jak ti můžeme říkat?</label>
                    <input type="text" id="user-name" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none transition" placeholder="Tvé jméno nebo přezdívka">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jaká je tvá situace?</label>
                    <select id="user-status" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                        <option value="jsem ve vztahu">Jsem ve vztahu a chci ho zlepšit</option>
                        <option value="jsem single a hledám vztah">Jsem single a mám strach ze seznamování</option>
                        <option value="procházím těžkým rozchodem">Procházím rozchodem</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">S čím ti dnes Couplii pomůže?</label>
                    <textarea id="user-problem" required rows="2" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none resize-none transition" placeholder="Např.: Hádáme se kvůli úklidu..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jak si přeješ, aby s tebou AI mluvila?</label>
                    <select id="user-tone" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                        <option value="tykej mi">Tykej mi (Přátelský tón)</option>
                        <option value="vykejte mi">Vykejte mi (Profesionální tón)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-blue-600 hover:from-teal-600 hover:to-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-all transform hover:scale-[1.02] mt-4">
                    Začít konverzaci ✨
                </button>
            </form>
        </div>
    </div>
<div id="chat-screen" class="hidden flex-1 flex h-full w-full bg-white">
        
        <aside class="w-64 bg-gray-50 border-r border-gray-200 hidden md:flex flex-col p-4 z-20">
            <button id="new-chat-btn" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-800 font-medium py-2 px-4 rounded-xl w-full mb-6 transition-colors flex items-center justify-center gap-2 shadow-sm">
                <span class="text-xl leading-none">+</span> Nový chat
            </button>
            <div class="text-xs font-semibold text-gray-500 mb-3 uppercase tracking-wider">Tvé konverzace</div>
            <div id="chat-list" class="space-y-1 overflow-y-auto chat-scroll flex-1">
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative w-full">
            <header class="h-16 flex items-center px-4 md:px-8 border-b border-gray-100 justify-between bg-white z-10">
                <h1 class="text-xl font-medium bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-blue-600">Couplii</h1>
                <button class="md:hidden text-gray-500">☰</button>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto chat-scroll p-4 md:p-8 space-y-6 pb-36">
                </div>

            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent pt-6 pb-6 px-4 md:px-8">
                <div class="max-w-3xl mx-auto relative">
                    <form id="chat-form" class="relative flex items-end border border-gray-300 rounded-2xl bg-white shadow-sm focus-within:ring-1 focus-within:ring-teal-500 focus-within:border-teal-500 transition-all">
                        <textarea id="message-input" rows="1" class="w-full max-h-32 p-4 pr-12 bg-transparent outline-none resize-none overflow-y-auto chat-scroll rounded-2xl" placeholder="Napiš zprávu... (Enter pro odeslání)"></textarea>
                        <button type="submit" id="send-btn" disabled class="absolute right-2 bottom-2 p-2 text-gray-400 hover:text-teal-600 transition-colors disabled:opacity-30 disabled:hover:text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" /></svg>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <main id="chat-screen" class="hidden flex-1 flex flex-col h-full relative bg-white w-full">
        <header class="h-16 flex items-center px-4 md:px-8 border-b border-gray-100 justify-between bg-white z-10">
            <h1 class="text-xl font-medium bg-clip-text text-transparent bg-gradient-to-r from-teal-600 to-blue-600">Couplii</h1>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto chat-scroll p-4 md:p-8 space-y-6 pb-36">
            </div>

        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent pt-6 pb-6 px-4 md:px-8">
            <div class="max-w-3xl mx-auto relative">
                <form id="chat-form" class="relative flex items-end border border-gray-300 rounded-2xl bg-white shadow-sm focus-within:ring-1 focus-within:ring-teal-500 focus-within:border-teal-500 transition-all">
                    <textarea id="message-input" rows="1" class="w-full max-h-32 p-4 pr-12 bg-transparent outline-none resize-none overflow-y-auto chat-scroll rounded-2xl" placeholder="Napiš zprávu... (Enter pro odeslání)"></textarea>
                    <button type="submit" id="send-btn" disabled class="absolute right-2 bottom-2 p-2 text-gray-400 hover:text-teal-600 transition-colors disabled:opacity-30 disabled:hover:text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" /></svg>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
